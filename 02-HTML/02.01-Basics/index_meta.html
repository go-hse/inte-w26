<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Meta Tag: Zeichenkodierung (Charset) -->
    <meta charset="utf-8">
    <!-- Meta Tag: Viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Meta Tags: Suchmaschinenoptimierung (SEO) & Dokumentation -->
    <meta name="description" content="Prägnante Zusammenfassung des Seiteninhalts in ca. 150 Zeichen.">
    <meta name="author" content="Ihr Name oder Firmenname">
    <meta name="robots" content="index, follow"> <!-- Erlaubt Suchmaschinen die Indizierung -->

    <!-- Meta Tags: Social Media Integration (Open Graph & Twitter Cards) -->
    <meta property="og:title" content="Titel für die Social-Media-Vorschau">
    <meta property="og:image" content="https://ihredomain.de/vorschaubild.jpg">
    <meta name="twitter:card" content="summary_large_image">

    <!-- Meta Tags: Simulation von HTTP-Headern; Leitet den Nutzer nach 5 Sekunden auf eine andere URL um -->
    <meta http-equiv="refresh" content="5; url=https://neuedomain.de/">
</head>

<body>
</body>

</html>
