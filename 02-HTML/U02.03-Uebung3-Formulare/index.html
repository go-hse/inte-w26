<!--
  Übung 3: Formulare

  Erstellen Sie das Anmeldeformular für eine Exkursion. Das Stylesheet ist fertig,
  danke.html zeigt nach dem Absenden, welche Daten übertragen wurden.

  Aufgabe 1   form mit action="danke.html" und method="get".
  Aufgabe 2   Gruppieren Sie die Felder mit fieldset und legend:
              „Persönliche Angaben“, „Exkursion“, „Anreise“, „Verpflegung“.
  Aufgabe 3   Jedes Feld bekommt ein label (verknüpft über for und id) und ein name-Attribut.
  Aufgabe 4   Felder in „Persönliche Angaben“ (Pflicht = required):
                Vorname          Text           Pflicht
                Nachname         Text           Pflicht
                E-Mail           E-Mail-Typ     Pflicht
                Matrikelnummer   Text           Pflicht
                Telefon          Telefon-Typ    optional
  Aufgabe 5   Matrikelnummer: genau 6 Ziffern – mit dem Attribut pattern prüfen.
  Aufgabe 6   „Exkursion“: Auswahlliste „Termin“ (Pflicht) mit den Optionen
              „Freitag, 13.11.2026“ und „Freitag, 20.11.2026“ sowie einer leeren Option
              „– bitte wählen –“. Zahlenfeld „Begleitpersonen“ von 0 bis 2.
  Aufgabe 7   „Anreise“: Radio-Buttons Bahn, Bus, Fahrrad – nur eine Auswahl möglich.
  Aufgabe 8   „Verpflegung“: Checkboxen vegetarisch und vegan – beide wählbar.
  Aufgabe 9   Mehrzeiliges Feld „Bemerkungen“ mit höchstens 300 Zeichen.
              Pflicht-Checkbox „Ich bin mit der Speicherung meiner Daten einverstanden.“
  Aufgabe 10  Verstecktes Feld kurs=inte-w26, Buttons „Anmelden“ (absenden) und
              „Zurücksetzen“.
  Testen      Senden Sie das Formular leer, mit falscher Matrikelnummer und korrekt ab.
              Welche Daten erscheinen in der Adresszeile und in danke.html?
-->
  <main>
    <h1>Anmeldung zur Exkursion</h1>
    <p>Exkursion zum Rechenzentrum der Hochschule. Mit * markierte Felder sind Pflichtfelder.</p>

    <!-- Ihr Formular hier -->

  </main>
